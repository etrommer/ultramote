# The URL the site will be built for
base_url = "https://etrommer.github.io/ultramote"
theme = "juice"
title = "Ultramote - LoRa remote trigger system"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[markdown.highlighting]
# Syntax highlighting; enabled by the presence of this table.
# `theme` replaces the `highlight_code`/`highlight_theme` options of Zola <= 0.21.
theme = "github-dark"

[extra]
juice_logo_name = "ultramote"
juice_logo_path = "um_logo.png"
juice_extra_menu = [
    { title = "GitHub", link = "https://github.com/etrommer/ultramote" },
]
# Put all your custom variables here
